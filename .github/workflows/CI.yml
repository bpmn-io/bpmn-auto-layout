
name: CI
on: [ push, pull_request ]
jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        node-version: [ 22.12, 24 ]

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run all
    - name: Check generated moddle types
      if: ${{ matrix.node-version == 24 }}
      run: npm run check:moddle-types
    - name: Check performance budgets
      if: ${{ matrix.node-version == 24 }}
      run: npm run test:performance
    - name: Build example
      if: ${{ matrix.node-version == 24 }}
      run: npm run build:example

  PublishExample:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: Build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build example
      run: npm run build:example
    - name: Update example
      env:
        GIT_USER_NAME: ${{secrets.BPMN_IO_USER_NAME}}
        GIT_USER_EMAIL: ${{secrets.BPMN_IO_EMAIL}}
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      run: |
        PAGES_DIRECTORY="$RUNNER_TEMP/gh-pages"

        git clone --depth=1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PAGES_DIRECTORY"
        cd "$PAGES_DIRECTORY"
        git fetch --depth=1 origin gh-pages
        git checkout -B gh-pages FETCH_HEAD
        git rm -r -q --ignore-unmatch -- . ':(exclude)reviews' ':(exclude)reviews/**'

        cp -r "$GITHUB_WORKSPACE/example/dist/"* "$PAGES_DIRECTORY"

        git config --local user.email "$GIT_USER_EMAIL"
        git config --local user.name "$GIT_USER_NAME"
        git config push.default simple
        git add -A

        if ! git diff --cached --quiet; then
          git commit -m "chore: update example"
          git push -q -u origin gh-pages
        fi